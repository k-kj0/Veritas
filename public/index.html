<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NPC Memory Demo — Mira the Herbalist</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 640px;
        margin: 40px auto;
        padding: 0 16px;
        background: #14161a;
        color: #e8e8e8;
      }
      h1 { font-size: 1.3rem; margin-bottom: 4px; }
      .meta { font-size: 0.85rem; color: #9aa0a6; margin-bottom: 16px; }
      #chat-log {
        border: 1px solid #333;
        border-radius: 8px;
        height: 360px;
        overflow-y: auto;
        padding: 12px;
        background: #1c1f24;
        margin-bottom: 12px;
      }
      .line { margin-bottom: 8px; line-height: 1.4; }
      .line.player strong { color: #6cb6ff; }
      .line.npc strong { color: #b28cff; }
      .line.system { color: #9aa0a6; font-style: italic; }
      form { display: flex; gap: 8px; }
      input[type="text"] {
        flex: 1;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #1c1f24;
        color: #e8e8e8;
      }
      button {
        padding: 10px 14px;
        border-radius: 6px;
        border: none;
        background: #6cb6ff;
        color: #0a0a0a;
        cursor: pointer;
        font-weight: 600;
      }
      #skip-day-btn { background: #3a3f47; color: #e8e8e8; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Mira the Herbalist — persistent-memory NPC demo</h1>
    <div class="meta">
      status: <span id="status-label">connecting…</span> · day:
      <span id="day-label">0</span> · relationship:
      <span id="relationship-label">0</span>
    </div>

    <div id="chat-log"></div>

    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Say something to Mira…" autocomplete="off" />
      <button type="submit">Send</button>
    </form>

    <button id="skip-day-btn">Skip to next day (debug time-skip)</button>

    <script type="module" src="/bundle.js"></script>
  </body>
</html>
